<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Module 7 Quiz | AI For All</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  margin:0;
  padding:40px;
}

.quiz-box{
  max-width:700px;
  background:#ffffff;
  padding:35px;
  margin:auto;
  border-radius:8px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

h2{
  text-align:center;
  color:#2f2f7e;
  margin-bottom:25px;
}

.question{
  margin-bottom:20px;
}

.question p{
  font-weight:600;
  margin-bottom:10px;
}

label{
  display:block;
  margin:6px 0;
}

.submit-btn{
  margin-top:30px;
  padding:12px 28px;
  background:#16a34a;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
  display:block;
  margin:auto;
}

.submit-btn:hover{
  background:#15803d;
}
</style>
</head>

<body>

<div class="quiz-box">
  <h2>Module 7 Quiz – Computer Vision</h2>

  <div class="question">
    <p>1. Computer Vision deals with?</p>
    <label><input type="radio" name="q1"> Images and videos</label>
    <label><input type="radio" name="q1"> Text data</label>
    <label><input type="radio" name="q1"> Audio signals</label>
  </div>

  <div class="question">
    <p>2. Edge detection is part of?</p>
    <label><input type="radio" name="q2"> Image processing</label>
    <label><input type="radio" name="q2"> Networking</label>
    <label><input type="radio" name="q2"> Databases</label>
  </div>

  <div class="question">
    <p>3. Object detection helps to?</p>
    <label><input type="radio" name="q3"> Identify objects in images</label>
    <label><input type="radio" name="q3"> Encrypt files</label>
    <label><input type="radio" name="q3"> Compress data</label>
  </div>

  <div class="question">
    <p>4. Facial recognition is an example of?</p>
    <label><input type="radio" name="q4"> Computer Vision</label>
    <label><input type="radio" name="q4"> NLP</label>
    <label><input type="radio" name="q4"> Robotics hardware</label>
  </div>

  <div class="question">
    <p>5. Autonomous vehicles use computer vision for?</p>
    <label><input type="radio" name="q5"> Road and obstacle detection</label>
    <label><input type="radio" name="q5"> Music playback</label>
    <label><input type="radio" name="q5"> Email sending</label>
  </div>

  <button class="submit-btn" onclick="submitQuiz()">Submit Quiz</button>
</div>

<script>
function submitQuiz(){
  localStorage.setItem("highestUnlockedModule","8");
  alert("Module 7 Quiz completed successfully!\nModule 8 is now unlocked.");
  window.location.href="module7.html";
}
</script>

</body>
</html>
